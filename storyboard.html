
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyboard | MangaVerse AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/pages.js" defer></script>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><span class="logo-icon">M</span><span>MangaVerse <strong>AI</strong></span></div>
        <nav class="navigation">
            <a href="index.html" class="nav-link">⌂ Tableau de bord</a>
            <a href="studio.html" class="nav-link">✦ Studio</a>
            <a href="characters.html" class="nav-link">♙ Personnages</a>
            <a href="world.html" class="nav-link">◎ Univers</a>
            <a href="story.html" class="nav-link">▤ Histoires</a>
            <a href="chapters.html" class="nav-link">▣ Chapitres</a>
            <a href="storyboard.html" class="nav-link active">▦ Storyboard</a>
            <a href="editor.html" class="nav-link">✎ Éditeur</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div><p class="breadcrumb">MangaVerse AI / Storyboard</p><h2>Storyboard</h2></div>
        </header>

        <section class="page-intro">
            <h1>Compose tes pages de manga.</h1>
            <p>Prépare les cases, les scènes et les dialogues avant l'illustration.</p>
        </section>

        <section class="editor-panel">
            <form id="panelForm">
                <label for="panelNumber">Numéro de la case</label>
                <input id="panelNumber" type="number" min="1" value="1">

                <label for="panelDescription">Description de la scène</label>
                <textarea id="panelDescription" rows="4" placeholder="Décris ce que le lecteur doit voir..."></textarea>

                <label for="panelDialogue">Dialogue</label>
                <textarea id="panelDialogue" rows="3" placeholder="Écris les paroles des personnages..."></textarea>

                <button class="primary-button" type="submit">Ajouter la case</button>
            </form>
        </section>

        <section class="projects-section">
            <h2>Cases de mon storyboard</h2>
            <div id="panelsContainer" class="projects-container"></div>
        </section>
    </main>
</div>
</body>
</html>
