
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univers | MangaVerse AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="js/pages.js" defer></script>
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><span class="logo-icon">M</span><span>MangaVerse <strong>AI</strong></span></div>
        <nav class="navigation">
            <a href="index.html" class="nav-link">⌂ Tableau de bord</a>
            <a href="studio.html" class="nav-link">✦ Studio</a>
            <a href="characters.html" class="nav-link">♙ Personnages</a>
            <a href="world.html" class="nav-link active">◎ Univers</a>
            <a href="story.html" class="nav-link">▤ Histoires</a>
            <a href="chapters.html" class="nav-link">▣ Chapitres</a>
            <a href="storyboard.html" class="nav-link">▦ Storyboard</a>
            <a href="editor.html" class="nav-link">✎ Éditeur</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div><p class="breadcrumb">MangaVerse AI / Univers</p><h2>Construction du monde</h2></div>
        </header>

        <section class="page-intro">
            <h1>Construis ton propre univers.</h1>
            <p>Imagine des royaumes, des villes, des organisations et des civilisations.</p>
        </section>

        <section class="editor-panel">
            <form id="worldForm">
                <label for="worldName">Nom de l'univers</label>
                <input id="worldName" required placeholder="Nom de ton monde">

                <label for="worldDescription">Description générale</label>
                <textarea id="worldDescription" rows="5" placeholder="Décris ton univers..."></textarea>

                <label for="worldPlaces">Lieux importants</label>
                <textarea id="worldPlaces" rows="4" placeholder="Villes, royaumes, villages..."></textarea>

                <label for="worldRules">Règles et particularités</label>
                <textarea id="worldRules" rows="4" placeholder="Magie, technologies, pouvoirs..."></textarea>

                <button class="primary-button" type="submit">Enregistrer mon univers</button>
            </form>
        </section>
        <section class="projects-section">
            <h2>Mes univers</h2>
            <div id="worldsContainer" class="projects-container"></div>
        </section>
    </main>
</div>
</body>
</html>
